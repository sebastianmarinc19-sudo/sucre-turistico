name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - services/destinos-service
          - services/alojamiento-service
          - services/gastronomia-service
          - services/experiencias-service
          - services/eventos-service
          - services/buscador-service
    steps:
      - uses: actions/checkout@v4

      - name: Check if service has code yet
        id: check
        run: |
          if [ -f "${{ matrix.service }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run tests (if present)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

      - name: Build Docker image
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: docker build -t ${{ matrix.service }} .

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend has code yet
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm install

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
