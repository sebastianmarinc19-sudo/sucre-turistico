name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - services/destinos-service
          - services/alojamiento-service
          - services/gastronomia-service
          - services/experiencias-service
          - services/eventos-service
          - services/buscador-service
    steps:
      - uses: actions/checkout@v4

      # El lockfile vive solo en la raíz porque usamos npm workspaces:
      # apuntar la caché a <servicio>/package-lock.json hacía fallar el job.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (raíz, incluye todos los workspaces)
        run: npm install

      - name: Ejecutar pruebas de ${{ matrix.service }} (si existen)
        run: npm test --workspace=${{ matrix.service }} --if-present

      - name: Construir imagen Docker de ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: docker build -t ci-build .

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
